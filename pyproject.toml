[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aga-ai-github-assistant"
version = "1.3.5"
description = "AI-powered GitHub assistant with file deployment, repo analysis, and README generation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Aswin NS" }
]
keywords = ["github", "ai", "groq", "llama", "assistant", "automation", "gradio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "gradio>=4.0.0",
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-groq",
    "langchain-core",
    "PyGithub>=2.0.0",
    "python-dotenv",
    "httpx",
    "click>=8.0.0",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock",
    "build",
    "twine",
]

[project.scripts]
aga = "cli.main:cli"

[project.urls]
Homepage = "https://github.com/AswinNS-dev/aga-ai-github-assistant"
Repository = "https://github.com/AswinNS-dev/aga-ai-github-assistant"
Issues = "https://github.com/AswinNS-dev/aga-ai-github-assistant/issues"

[tool.setuptools]
packages = ["aga", "aga.core", "aga.modules", "aga.utils", "app", "cli"]
include-package-data = false
py-modules = []

[tool.setuptools.package-dir]
aga = "aga"
app = "app"
cli = "cli"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
